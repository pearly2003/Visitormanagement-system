<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Visitor Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar glass-effect-nav">
        <div class="nav-content">
            <div class="logo">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px;"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                <span>Grand Residency</span>
            </div>
            <a href="index.html" class="admin-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px;"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
                Back to Form
            </a>
        </div>
    </nav>

    <div class="main-layout" id="mainContainer">
        <!-- LOGIN SECTION -->
        <div class="form-section" id="loginSection" style="margin: 0 auto; max-width: 450px; width: 100%;">
            <div class="form-wrapper glass-effect">
                <div class="form-header">
                    <h2>Admin Login</h2>
                    <p>Secure access for security personnel</p>
                </div>
                <form id="loginForm">
                    <div class="input-group">
                        <label for="Username">Username</label>
                        <input type="text" id="Username" required placeholder="Enter username (e.g. admin)">
                    </div>
                    <div class="input-group">
                        <label for="Password">Password</label>
                        <input type="password" id="Password" required placeholder="Enter password (123)">
                    </div>
                    <div id="loginError" style="color: #f87171; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); padding: 10px; border-radius: 8px; margin-bottom: 15px; display: none; font-size: 14px; text-align: center;">Invalid username or password</div>
                    <button type="submit" class="submit-btn">Login to Dashboard</button>
                </form>
            </div>
        </div>

        <!-- TABLE SECTION -->
        <div class="table-section" id="adminTableSection" style="display: none; width: 100%;">
            <div class="table-wrapper glass-effect">
                <div class="header-row">
                    <h2>Recent Visitors</h2>
                    <button id="logoutBtn" class="admin-btn" style="background: rgba(239, 68, 68, 0.1); border-color: rgba(239, 68, 68, 0.2); color: #ef4444; cursor: pointer;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px;"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                        Logout
                    </button>
                </div>
                <div class="table-responsive">
                    <table id="visitorTable">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Mobile</th>
                                <th>Vehicle</th>
                                <th>Purpose</th>
                                <th>Resident</th>
                                <th>Flat</th>
                                <th>Entry Time</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <tr>
                                <td colspan="8" style="text-align: center; color: #94a3b8; padding: 30px;">Loading data securely...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <script src="admin.js"></script>
</body>
</html>
